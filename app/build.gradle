plugins {
    id 'com.android.application'
}

def cineLocalProperties = new Properties()
def cineLocalFile = rootProject.file('local.properties')
if (cineLocalFile.exists()) {
    cineLocalFile.withInputStream { stream ->
        cineLocalProperties.load(stream)
    }
}
def cineConfig = { String name ->
    def value = providers.gradleProperty(name)
        .orElse(providers.environmentVariable(name))
        .orElse(cineLocalProperties.getProperty(name, '')).get().trim()
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"')
        .replace('\r', '').replace('\n', '') + '"'
}

android {
    namespace 'com.cinestream.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cinestream.android'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'TMDB_API_KEY', cineConfig('TMDB_API_KEY')
        buildConfigField 'String', 'TMDB_ACCESS_TOKEN', cineConfig('TMDB_ACCESS_TOKEN')
        buildConfigField 'String', 'OMDB_API_KEY', cineConfig('OMDB_API_KEY')
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align Kotlin runtimes pulled in transitively by AndroidX, as in Stride.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
}
